spring:
  application:
    name: music-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musicdb}
    username: ${SPRING_DATASOURCE_USERNAME:music}
    password: ${SPRING_DATASOURCE_PASSWORD:music}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

# TODO: configure springdoc-openapi paths if needed

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:300}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:album-covers}
    presign-expiration-seconds: ${PRESIGN_EXPIRATION_SECONDS:1800}
  regionais:
    url: ${REGIONAIS_URL:https://integrador-argus-api.geia.vip/v1/regionais}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
