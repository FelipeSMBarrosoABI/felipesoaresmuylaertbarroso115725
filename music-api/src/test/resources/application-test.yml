spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1pbi10ZXN0cw==
    access-ttl-seconds: 300
    refresh-ttl-seconds: 86400
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: test-bucket
    presign-expiration-seconds: 1800
  regionais:
    url: http://localhost:8081/v1/regionais

logging:
  level:
    root: WARN
    br.com.seplag.musicapi: DEBUG
